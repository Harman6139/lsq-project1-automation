   <text style="font-weight: 700; font-size: 21px; font-family: 'Times New Roman'; text-anchor: start" x="61.2" y="34.56" transform="rotate(-0 61.2 34.56)">Which checks find losses recorded three months late?</text>
  </g>
  <g id="text_15">
   <text style="font-size: 12.5px; font-family: 'Times New Roman'; text-anchor: start" x="61.2" y="62.208" transform="rotate(-0 61.2 62.208)">Three arrangements tied at 192 of 194 edited histories, with one warning on an unchanged history.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 11px; font-family: 'Times New Roman'; text-anchor: start" x="61.2" y="386.64" transform="rotate(-0 61.2 386.64)">B = small gains versus small losses. D = unusually few losing months.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11px; font-family: 'Times New Roman'; text-anchor: start" x="61.2" y="400.464" transform="rotate(-0 61.2 400.464)">A = similar returns in consecutive months. Z = tiny gains piling up just above zero.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 11px; font-family: 'Times New Roman'; text-anchor: start" x="61.2" y="416.88" transform="rotate(-0 61.2 416.88)">The lines follow the same three arrangements as the warning cap changes. Lines can overlap.</text>
